[project]
name = "graderguard"
version = "0.1.0"
description = "Audit benchmark-task graders for reward hacking before the tasks ship."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
graderguard = "graderguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graderguard"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Local hooks reuse the uv-locked tool versions, so pre-commit and CI never drift apart.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: ascii-only
        name: ASCII-only text
        entry: "[^\\x00-\\x7F]"
        language: pygrep
        types_or: [python, markdown, yaml, toml, makefile]

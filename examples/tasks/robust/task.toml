# Sample task with a robust grader: fresh random inputs at grading time, an independent
# oracle, byte-exact comparison, pristine tests restored and conftest.py files ignored.
name = "run-length-encode"
description = "Run-length encode a string; the grader cannot be gamed by the built-in cheats."

[agent]
programs = ["rle.py"]
outputs = ["out/encoded.txt"]
tests_visible = true

[solution]
command = 'cp "$GG_SOLUTION_DIR/rle.py" rle.py && python rle.py'
timeout_sec = 30

[grader]
command = "python -m pytest -q -p no:cacheprovider --noconftest tests"
timeout_sec = 60
refresh_tests = true
